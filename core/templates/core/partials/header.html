{% load static %}
<header class="border-bottom mb-4">
    <div class="container py-3 d-flex flex-wrap flex-lg-nowrap align-items-center gap-3">
        <a href="{% url 'questions:index' %}" class="logo flex-shrink-0">Ask</a>
        <form class="header-search" role="search" action="{% url 'questions:index' %}" method="get">
            <input type="search" name="q" class="form-control"
                   placeholder="Поиск" aria-label="Поиск">
        </form>
        <div class="header-actions d-flex flex-column flex-md-row align-items-md-center gap-2">
            <a href="{% url 'questions:ask' %}" class="btn btn-success">Задать вопрос</a>
            {% if user.is_authenticated or show_profile %}
                <div class="user-block ms-md-auto d-flex align-items-center gap-2">
                    <img src="{% static 'core/img/avatar.svg' %}" alt="Аватар Dr. Pepper"
                         width="48" height="48" class="rounded avatar">
                    <div class="small">
                        <div class="fw-semibold">Dr. Pepper</div>
                        <a href="{% url 'core:profile' %}">Настройки</a>
                        <a href="{% url 'questions:index' %}">Выйти</a>
                    </div>
                </div>
            {% else %}
                <div class="user-block ms-md-auto d-flex gap-2">
                    <a href="{% url 'core:login' %}" class="btn btn-outline-primary flex-fill">Войти</a>
                    <a href="{% url 'core:signup' %}" class="btn btn-primary flex-fill">Регистрация</a>
                </div>
            {% endif %}
        </div>
    </div>
</header>
