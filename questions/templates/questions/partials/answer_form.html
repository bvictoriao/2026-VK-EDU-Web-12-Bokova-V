<section class="mb-4" aria-labelledby="answer-form-heading">
                    <h2 id="answer-form-heading" class="h4">Ваш ответ</h2>
                    <form>
                        <div class="mb-3">
                            <label for="answer-text" class="form-label">Текст ответа</label>
                            <textarea id="answer-text" name="answer" class="form-control"
                                      rows="5" maxlength="5000" required
                                      aria-describedby="answer-help"></textarea>
                            <div id="answer-help" class="form-text">
                                Напишите подробный ответ. Максимум 5000 символов.
                            </div>
                        </div>
                        <button type="button" class="btn btn-success">Отправить ответ</button>
                    </form>
                </section>
